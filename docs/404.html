<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Addecondominios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript">
      // SPA routing for GitHub Pages
      // Redirect non-root paths to hash routes
      var pathname = window.location.pathname;
      
      // Only process if not root and not index.html
      if (pathname !== '/' && !pathname.includes('index.html') && !pathname.includes('.')) {
        // Remove trailing slash and convert to hash route
        var pathWithoutSlash = pathname.replace(/\/$/, '');
        if (pathWithoutSlash !== '') {
          var hashPath = '/#' + pathWithoutSlash;
          console.log('Redirecting', pathname, 'to', hashPath);
          window.location.replace(hashPath);
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <p>This page requires JavaScript to work properly. <a href="/">Go to homepage</a></p>
    </noscript>
  </body>
</html>
