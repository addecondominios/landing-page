<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Addecondominios</title>
    <script type="text/javascript">
      // Redirect to index.html for SPA routing
      var pathArray = window.location.pathname.split('/');
      var pathName = pathArray[pathArray.length - 1];
      
      if (pathName !== '' && !pathName.includes('.')) {
        window.location.replace('/index.html?redirect=' + window.location.pathname);
      }
    </script>
  </head>
  <body></body>
</html>
