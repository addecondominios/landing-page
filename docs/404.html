<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Addecondominios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript">
      // SPA routing for GitHub Pages
      // Convert standard routes to hash routes for HashRouter
      var pathname = window.location.pathname;
      var baseHref = '/'; // Change if your site is in a subdirectory
      
      // Remove base href from pathname
      var path = pathname.replace(new RegExp('^' + baseHref.replace(/\//g, '\\/') + '(?!index\\.html)'), '');
      
      // Only redirect if it's not a file (no extension) and not the root
      if (!path.includes('.') && path && path !== '/') {
        // Convert /privacy to /#/privacy
        var hashPath = '/#' + (path.startsWith('/') ? path : '/' + path);
        var redirect = hashPath + window.location.search + window.location.hash;
        sessionStorage.redirect = redirect;
        window.location.replace(baseHref + redirect);
      }
    </script>
  </head>
  <body>
    <!-- This page is a catch-all for GitHub Pages SPA routing -->
  </body>
</html>
