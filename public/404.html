    <script type="text/javascript">
      // SPA routing for GitHub Pages with BrowserRouter
      // GitHub Pages serves 404.html for any path that doesn't exist as a real file
      // This redirects to index.html while preserving the original path
      // React Router (BrowserRouter) then handles the routing
      
      var pathname = window.location.pathname;
      var search = window.location.search;
      var pathAndSearch = pathname + search;
      
      // Get the path relative to the root (removes domain)
      var reloadPath = '/#' + pathAndSearch;
      
      // Check if this is a root request or contains a file extension
      if (pathname !== '/' && !pathname.includes('index.html') && !pathname.includes('.')) {
        // Removing the hash and using the original path since we're using BrowserRouter now
        // This will be handled by React Router
        console.log('GitHub Pages serving index.html for', pathname);
      }
      
      // Always serve index.html content for non-file routes
      // The browser will remain on the current path (pathname preserved)
      // React Router will read window.location.pathname and render the correct component
    </script>
  </head>
